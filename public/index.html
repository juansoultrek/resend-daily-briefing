<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Briefing | JuanSoulTrek</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16">
  <meta name="theme-color" content="#0f172a">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main>
    <p class="eyebrow">Resend Daily Briefing</p>
    <h1>What changed in your repos</h1>
    <p class="intro">
      A daily AI-analyzed briefing of the latest changes across the providers you follow —
      delivered to your inbox each morning. Built with Resend.
    </p>

    <div class="card">
      <label class="field">
        <span>Email</span>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
      </label>

      <div id="nameWrap" class="field" style="display:none">
        <span>Name (optional)</span>
        <input type="text" id="name" placeholder="Your name" autocomplete="name">
      </div>

      <div id="providersWrap" style="display:none">
        <span class="muted" style="display:block;margin-bottom:8px;letter-spacing:0.08em;text-transform:uppercase;font-size:0.78rem;">Providers</span>
        <div id="providers" class="providers"></div>
      </div>

      <button id="actionBtn" disabled>Continue</button>
      <div id="status" class="status"></div>
    </div>

    <a class="back" href="/">Back to home</a>
  </main>

  <script src="assets/app.js"></script>
  <script>
    const { BASE, getJson, postJson, renderProviders, showStatus, getCheckedSlugs } = window.RDB;
    const emailEl = document.getElementById("email");
    const nameWrap = document.getElementById("nameWrap");
    const providersWrap = document.getElementById("providersWrap");
    const providersEl = document.getElementById("providers");
    const btn = document.getElementById("actionBtn");
    const statusEl = document.getElementById("status");

    let mode = "idle"; // idle | subscribe | manage
    let currentProviders = new Set();

    async function detect() {
      const email = emailEl.value.trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        providersWrap.style.display = "none";
        nameWrap.style.display = "none";
        btn.disabled = true;
        return;
      }
      const { data } = await getJson(`/lookup?email=${encodeURIComponent(email)}`);
      if (!data || !data.ok) return;
      if (data.exists && data.confirmed) {
        // Existing confirmed subscriber → manage mode
        mode = "manage";
        currentProviders = new Set(data.providers);
        nameWrap.style.display = "none";
        providersWrap.style.display = "block";
        await renderProviders(providersEl, currentProviders);
        btn.disabled = false;
        btn.textContent = "Save subscriptions";
        showStatus(statusEl, "info", "You're already subscribed. Adjust the providers below and save.");
      } else {
        // New (or unconfirmed) → subscribe mode
        mode = "subscribe";
        currentProviders = new Set();
        nameWrap.style.display = "block";
        providersWrap.style.display = "block";
        await renderProviders(providersEl, currentProviders);
        btn.disabled = false;
        btn.textContent = "Subscribe";
        if (data.exists && !data.confirmed) {
          showStatus(statusEl, "info", "We sent you a confirmation email — check your inbox (and spam) to confirm.");
        } else {
          statusEl.className = "status";
        }
      }
    }

    let debounce;
    emailEl.addEventListener("input", () => {
      clearTimeout(debounce);
      debounce = setTimeout(detect, 350);
    });

    btn.addEventListener("click", async () => {
      const email = emailEl.value.trim().toLowerCase();
      const providers = getCheckedSlugs(providersEl);
      if (providers.length === 0) {
        showStatus(statusEl, "err", "Select at least one provider.");
        return;
      }
      btn.disabled = true;
      btn.textContent = "Working…";
      try {
        if (mode === "subscribe") {
          const name = document.getElementById("name").value.trim();
          const { data } = await postJson("/subscribe", { email, name: name || undefined, providers });
          if (data && data.ok && data.alreadySubscribed) {
            showStatus(statusEl, "info", "You're already subscribed. Switching to manage mode.");
            detect();
          } else if (data && data.ok && data.confirmationSent) {
            showStatus(statusEl, "ok", "Confirmation email sent. Check your inbox (and spam) to confirm.");
            btn.textContent = "Subscribe";
          } else {
            showStatus(statusEl, "err", (data && data.error) || "Something went wrong.");
            btn.textContent = "Subscribe";
          }
        } else {
          const { data } = await postJson("/manage", { email, providers });
          if (data && data.ok) {
            showStatus(statusEl, "ok", "Saved. Your next briefing will include the selected providers.");
            btn.textContent = "Save subscriptions";
          } else {
            showStatus(statusEl, "err", (data && data.error) || "Could not save.");
            btn.textContent = "Save subscriptions";
          }
        }
      } catch (e) {
        showStatus(statusEl, "err", "Network error. Try again.");
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
