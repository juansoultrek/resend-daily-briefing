<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage subscriptions | Daily Briefing</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16">
  <meta name="theme-color" content="#0f172a">
  <script>
    window.__RDB_BASE = (function () {
      var m = location.pathname.match(/^(\/[^\/]+)/);
      return m ? m[1] : "";
    })();
  </script>
  <link rel="stylesheet" href="/resend/assets/styles.css">
</head>
<body>
  <main>
    <p class="eyebrow">Manage subscriptions</p>
    <h1>Your providers</h1>
    <p class="intro" id="intro">Loading your current subscriptions…</p>

    <div class="card" id="card" style="display:none">
      <div id="providers" class="providers"></div>
      <button id="saveBtn">Save changes</button>
      <div id="status" class="status"></div>
    </div>

    <a class="back" href="/resend">Back to subscribe</a>
  </main>

  <script src="/resend/assets/app.js"></script>
  <script>
    (function () {
      var RDB = window.RDB;
      var token = new URLSearchParams(location.search).get("token");
      var introEl = document.getElementById("intro");
      var cardEl = document.getElementById("card");
      var providersEl = document.getElementById("providers");
      var saveBtn = document.getElementById("saveBtn");
      var statusEl = document.getElementById("status");

      if (!RDB) {
        introEl.textContent = "App script failed to load.";
        return;
      }

      (async function () {
        if (!token) {
          introEl.textContent = "Missing token. Use the link from your email.";
          return;
        }
        var result = await RDB.getJson("/subscriber?token=" + encodeURIComponent(token));
        var data = result.data;
        if (!data || !data.ok) {
          introEl.textContent = (data && data.error) || "Subscriber not found or already unsubscribed.";
          return;
        }
        introEl.textContent = "Signed in as " + data.email + ". Toggle the providers you want to receive.";
        cardEl.style.display = "block";
        await RDB.renderProviders(providersEl, new Set(data.providers));
      })();

      saveBtn.addEventListener("click", async function () {
        var providers = RDB.getCheckedSlugs(providersEl);
        if (providers.length === 0) {
          RDB.showStatus(statusEl, "err", "Select at least one provider, or unsubscribe instead.");
          return;
        }
        saveBtn.disabled = true;
        saveBtn.textContent = "Saving…";
        var result = await RDB.postJson("/manage", { token: token, providers: providers });
        var data = result.data;
        if (data && data.ok) {
          RDB.showStatus(statusEl, "ok", "Saved. Your next briefing will include the selected providers.");
        } else {
          RDB.showStatus(statusEl, "err", (data && data.error) || "Could not save.");
        }
        saveBtn.disabled = false;
        saveBtn.textContent = "Save changes";
      });
    })();
  </script>
</body>
</html>
